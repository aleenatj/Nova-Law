<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject | default('Nova') }}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333333;
            max-width: 506px;
            margin: 0 auto;
            padding: 0;
            background-color: #f8f9fa;
        }
        p {
            color: #333333 !important;
        }
        h2, h3, h4 {
            color: #333333;
        }
        h2 {
            margin-top: 0;
        }
        li {
            color: #333333;
        }
        .email-container {
            max-width: 506px;
            border-radius: 8px;
            background-color: #ffffff;
            overflow: hidden;
            margin: 0 auto;
        }
        .content {
            padding: 38px 40px;
            font-size: 16px;
        }
        .content p,
        .content li,
        .content div,
        .content span {
            font-size: 16px;
        }
        .footer {
            /* background: linear-gradient(135deg, #FFF5F2 0%, #FFBD83 55%, #FF8E65 100%); */
            /* background: linear-gradient(135deg, #FFB457 0%, #FF6A42 50%, #E64194 100%); */
            /* background: linear-gradient(135deg, #FFF5F2 0%, #FFBD83 55%, #FF8E65 100%); */
            background-color: #f8f9fa;
            padding: 24px 16px;
            border-top: none;
            font-size: 12px !important;
            color: #ffffff;
        }
        .footer p,
        .footer a,
        .footer div,
        .footer span {
            font-size: 12px !important;
        }
        .footer a {
            color: #333539CC !important;
            text-decoration: underline;
        }
        .header {
            background: linear-gradient(90deg,rgba(255, 106, 66, 0.12) 0%, rgba(255, 180, 87, 0.12) 100%);
            color: #ffffff;
            padding: 15px 30px;
            text-align: center;
        }
        .header-logo {
            height: 65px;
            width: auto;
            display: block;
            margin: 0 auto 12px;
        }
        .header-title {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
            line-height: 1.3;
        }
        .btn {
            font-size: 16px;
            line-height: 20px;
            letter-spacing: 0%;
            text-align: center;
            vertical-align: middle;
            opacity: 1;
            display: inline-block;
            padding: 12px;
            width: 90%;
            background: #FFCC2D !important;
            color: #07161e !important;
            text-decoration: none;
            border-radius: 54px;
            font-weight: 700;
            margin: 10px 0;
            transition:
                color 0.3s ease,
                background 0.3s ease,
                box-shadow 0.3s ease;
        }
        /* Matches .landing-primary-button:hover (purple → pink) as seen in browser. */
        .btn:hover {
            box-shadow: 0 10px 25px rgba(7, 22, 30, 0.25);
            background: linear-gradient(
                90deg,
                #FF6A42 0%,
                #E8731E 100%
            ) !important;
            color: #ffffff !important;
        }
        .link {
            font-size: 12px;
            line-height: 24px;
            text-align: center;
            color:#333539CC !important;
        }
        .text-center {
            text-align: center;
        }
        .align-left {
            text-align: left !important;
        }
        .section-heading {
            margin-top: 0;
            color: #07161E;
        }
        .text-muted {
            color: #6c757d;
        }

        /* Data Table Styles */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }
        .data-table th,
        .data-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #e9ecef;
            font-size: 14px;
        }
        .data-table th {
            background-color: #f8f9fa;
            font-weight: 600;
            color: #333333;
            width: 35%;
        }
        .data-table td {
            color: #333333;
        }
        .data-table tr:last-child th,
        .data-table tr:last-child td {
            border-bottom: none;
        }
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #333333;
            margin: 20px 0 10px 0;
            padding-bottom: 5px;
            border-bottom: 2px solid #e9ecef;
        }

        /* Profile Placeholder Styles */
        .profile-placeholder {
            background-color: #e9ecef;
            border-radius: 50%;
            display: inline-block;
            text-align: center;
            color: #6c757d;
            font-weight: 600 !important;
        }
        .profile-placeholder-small {
            width: 20px;
            height: 20px;
            line-height: 20px;
            font-size: 9px !important;
        }
        .profile-placeholder-medium {
            width: 30px;
            height: 30px;
            line-height: 30px;
            font-size: 12px !important;
        }
        .profile-placeholder-large {
            width: 50px;
            height: 50px;
            line-height: 50px;
            font-size: 20px !important;
        }
        .profile-placeholder-bordered {
            border: 2px solid #007bff;
        }
        .profile-placeholder-bordered-light {
            border: 1px solid #ddd;
        }

        /* Mobile Responsive Styles */
        @media only screen and (max-width: 600px) {
            body {
                max-width: 100% !important;
                padding: 10px !important;
            }
            .email-container {
                max-width: 100% !important;
                margin: 0 !important;
            }
            .content {
                padding: 15px !important;
            }
            .footer {
                padding: 15px !important;
            }
            .header {
                padding: 20px !important;
            }
            .header-logo {
                height: 32px !important;
                margin: 0 auto 10px auto !important;
            }
            .header-title {
                font-size: 20px !important;
            }
            h2 {
                font-size: 18px !important;
            }
            h3 {
                font-size: 16px !important;
            }
            h4 {
                font-size: 14px !important;
            }
            .btn {
                padding: 10px 20px !important;
                font-size: 16px !important;
            }
        }
    </style>
</head>
<body>
    <div class="email-container" style="border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);">
        {% include "html/partials/header.html" %}

        <div class="content">
            {% block content %}
            <!-- Content will be injected here -->
            {% endblock %}

            <!-- <p style="margin-top: 30px; font-size: 16px; color: #333539CC !important;"><strong>{{message|default('Thank you for being part of the Nova network.')}}</strong></p> -->

            <p style="margin-top: 30px;">Kind regards<br><br>{{ team_name }}</p>
            {% block after_signoff %}{% endblock %}
        </div>

        {% include "html/partials/footer.html" %}
    </div>
</body>
</html>
